<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Ticket</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='auth.css') }}"
    >
</head>

<body>

<div style="max-width: 700px; margin: 50px auto; padding: 30px;">

    <h1>Create Support Ticket</h1>

    <p>
        Report your technical issue to the IT support team.
    </p>

    {% if error %}
        <div class="alert">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <div class="form-group">

            <label for="title">
                Ticket Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                class="form-input"
                placeholder="Example: Wi-Fi not connecting"
                required
            >

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                class="form-input"
                rows="6"
                placeholder="Describe the problem..."
                required
            ></textarea>

        </div>


        <div class="form-group">

            <label for="category_id">
                Category
            </label>

            <select
                id="category_id"
                name="category_id"
                class="form-input"
                required
            >

                <option value="">
                    Select category
                </option>

                {% for category in categories %}

                    <option value="{{ category.id }}">
                        {{ category.name }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label for="priority">
                Priority
            </label>

            <select
                id="priority"
                name="priority"
                class="form-input"
            >

                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>

            </select>

        </div>


        <div class="form-group">

            <label for="severity">
                Severity
            </label>

            <select
                id="severity"
                name="severity"
                class="form-input"
            >

                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>

            </select>

        </div>


        <button
            type="submit"
            class="submit-button"
        >
            Create Ticket
        </button>

    </form>

</div>

</body>
</html>
